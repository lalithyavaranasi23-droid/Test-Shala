<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Unlock Me</title>

<!-- iPhone app-like -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4f1">

<style>
/* Reset */
body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  overflow-x: hidden;
  background: #f6f4f1;
}

/* Screens */
.screen {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
  pointer-events: none;
  position: relative;
  min-height: 70vh;
}

.screen.active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* Buttons */
button {
  padding: 12px 20px;
  margin: 10px;
  border-radius: 20px;
  border: none;
  background: #d8cfc4;
  font-size: 16px;
  transition: transform 0.15s ease, background 0.15s ease;
}

button:active {
  transform: scale(0.96);
}

.option {
  display: block;
  margin: 8px auto;
  width: 85%;
}

/* Pattern */
.pattern button {
  background: #e7e2dc;
}

.pattern button.clicked {
  background: #cfc7bb;
}

/* Unlock pulse */
.unlock {
  animation: unlockPulse 0.8s ease;
}

@keyframes unlockPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* FLOATING HEARTS */
.hearts {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}

.heart {
  position: absolute;
  bottom: -20px;
  font-size: 30px;
  opacity: 0.5;
  animation: floatUp 10s linear infinite;
  color: #9A0016;
}

.heart:nth-child(1) { left: 10%; animation-delay: 0s; }
.heart:nth-child(2) { left: 30%; animation-delay: 2s; }
.heart:nth-child(3) { left: 50%; animation-delay: 4s; }
.heart:nth-child(4) { left: 70%; animation-delay: 6s; }
.heart:nth-child(5) { left: 85%; animation-delay: 8s; }

@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  20% { opacity: 0.5; }
  100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
}

/* Final Screen */
#finalScreen {
  min-height: 80vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-start;   /* left align */
  padding-left: 24px;            /* spacing from left edge */
  background-color: #eae6df;
  background-image: url("./background.jpeg");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  position: relative;
}

#finalText {
  text-align: left;
  animation: fadeInSlow 2s ease forwards;
  display: inline-block;
}

#finalText p span {
  background: rgba(255,255,255,0.6); /* only behind text */
  padding: 2px 6px;
  border-radius: 3px;
  display: inline;
}

/* Fade-in animation */
@keyframes fadeInSlow {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Responsive tweaks for iPhone 17 */
@media (max-width: 430px) {
  button {
    font-size: 15px;
    padding: 10px 16px;
  }
  .heart {
    font-size: 28px;
  }
  #finalText {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<!-- Screen 1 -->
<div id="screen1" class="screen active">
  <div class="hearts">
    <span class="heart">❤️</span><span class="heart">❤️</span>
    <span class="heart">❤️</span><span class="heart">❤️</span>
    <span class="heart">❤️</span>
  </div>

  <p>Not everyone can unlock this.</p>

  <button onclick="startExperience()">Start</button>
</div>

<!-- Screen 2 -->
<div id="screen2" class="screen">
  <div class="hearts">
    <span class="heart">❤️</span><span class="heart">❤️</span>
    <span class="heart">❤️</span><span class="heart">❤️</span>
    <span class="heart">❤️</span>
  </div>

  <h3>🔒 Unlock</h3>

  <p>Q1: The month we first spoke</p>
  <button class="option" onclick="q1('Feb')">Feb</button>
  <button class="option" onclick="q1('Dec')">Dec</button>
  <button class="option" onclick="q1('Aug')">Aug</button>
  <button class="option" onclick="q1('June')">June</button>

  <div id="q2" style="display:none;">
    <p>Q2: First temple we visited together</p>
    <button class="option" onclick="q2('Kapaleeshwar')">Kapaleeshwar</button>
    <button class="option" onclick="q2('Thiruporur')">Thiruporur</button>
    <button class="option" onclick="q2('Murugan in Berlin')">Murugan in Berlin</button>
    <button class="option" onclick="q2('Nithya kalyana Perumal')">Nithya kalyana Perumal</button>
  </div>
</div>

<!-- Screen 3 -->
<div id="screen3" class="screen">
  <div class="hearts">
    <span class="heart">❤️</span><span class="heart">❤️</span>
    <span class="heart">❤️</span><span class="heart">❤️</span>
    <span class="heart">❤️</span>
  </div>

  <p>Tap the top feelings of today!</p>
  <div class="pattern">
    <button onclick="tap(event)">Peace</button>
    <button onclick="tap(event)">Hurt</button>
    <button onclick="tap(event)">Anger</button>
    <button onclick="tap(event)">Satisfying</button>
  </div>
</div>

<!-- Screen 4 -->
<div id="screen4" class="screen">
  <div id="finalScreen">
    <div id="finalText">
      <p><span><strong><i> High Five 🙌 <br><br><br>
       You could unlock this only because you’re mine!!</i></strong></span></p>
      <p style="margin-top:40px;">
        <span><strong><i>Sharath ❤️<br>I don’t need perfect days to choose you.</i></strong></span>
      </p>
    </div>
  </div>
</div>

<!-- Audio -->
<audio id="bell" src="bell.mp3" preload="auto"></audio>
<audio id="music" src="song.mp3" preload="auto" loop></audio>

<script>
let taps = 0;

function goTo(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen' + n).classList.add('active');
}

function startExperience() {
  const music = document.getElementById('music');
  music.volume = 0.4;
  music.play();
  goTo(2);
}

function q1(ans) {
  if (ans === 'Feb') {
    document.getElementById('q2').style.display = 'block';
  }
}

function q2(ans) {
  if (ans === 'Kapaleeshwar') {
    document.getElementById('screen2').classList.add('unlock');
    document.getElementById('bell').play();
    setTimeout(() => goTo(3), 900);
  }
}

// Mood screen: move to next after 2 taps
function tap(e) {
  e.target.classList.add("clicked");
  taps++;
  if (taps === 2) {   // <-- changed from 4 to 2
    setTimeout(() => goTo(4), 700);
  }
}
</script>

</body>
</html>
